name: Synthetic scale benchmark

on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --dev --frozen
      - run: uv run python -m tools.benchmark_scale --files 30000 --symbols 10 --out scale-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-scale-report
          path: scale-report.json
