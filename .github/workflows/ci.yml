name: Axon CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --dev --frozen
      - name: Lint active Python code
        run: |
          uv run ruff check axon/v1 axon/api/app.py cli tests/v1 tests/cli tests/evals
          uv run ruff format --check axon/v1 axon/api/app.py cli tests/v1 tests/cli tests/evals
      - name: Typecheck v1 and evals
        run: uv run mypy axon/v1 tests/evals
      - name: Run infrastructure-free tests
        run: uv run pytest
      - name: Run language and framework evals
        if: always()
        run: uv run python -m tests.evals.harness --json eval-report.json
      - name: Upload language eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axon-language-evals
          path: eval-report.json
          if-no-files-found: warn
      - name: Test the MCP adapter
        run: uv run --project axon-mcp --frozen pytest axon-mcp/tests
      - name: Build and smoke-test the wheel
        run: |
          uv build
          wheel="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          uv run --no-project --with "$wheel" axon --help >/dev/null

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check main build contains no demo data
        run: |
          if grep -rqiE 'fixture-monorepo|api\.stripe\.com' dist; then
            echo "demo data leaked into the main build"
            exit 1
          fi
      - name: Build the separate demo build
        run: npm run build:demo
