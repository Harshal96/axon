[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axon"
version = "0.2.0"
description = "API-first code graph: per-API dependencies, PR impact, and graph-grounded natural-language questions"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Harshal Parekh" }]
keywords = ["api", "code-graph", "dependency-graph", "static-analysis", "neo4j"]
requires-python = ">=3.11"
dependencies = [
    "axon-core==0.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "neo4j>=5.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "anyio>=4.4.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "hypothesis>=6.100.0",
    "websockets>=12.0",
    "mcp>=1.2.0",
]

[dependency-groups]
dev = [
    "axon-cli==0.2.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "anyio>=4.4.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "hypothesis>=6.100.0",
    "websockets>=12.0",
    "mcp>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/Harshal96/axon"
Repository = "https://github.com/Harshal96/axon"
Issues = "https://github.com/Harshal96/axon/issues"

[project.scripts]
axon-init = "axon.v2.store:cli_init"
axon-server = "axon.api.app:main"

[tool.hatch.build.targets.wheel]
only-include = [
    "axon/api/__init__.py", "axon/api/app.py", "axon/api/routes/__init__.py",
    "axon/api/routes/health.py", "axon/v2/api.py", "axon/v2/jobs.py",
]

[tool.uv.workspace]
members = ["axon-core", "axon-cli", "axon-mcp"]

[tool.uv.sources]
axon-core = { workspace = true }
axon-cli = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The default gate covers the active, infrastructure-free v2 implementation.
# Legacy integration suites remain available when invoked by explicit path.
testpaths = ["tests/v2", "tests/cli", "tests/evals"]
markers = [
    "tier1: contract tests (fast, always run)",
    "tier2: scenario tests (medium, run on PR)",
    "tier3: system tests (slow, run nightly)",
    "regression: golden file comparison",
]
addopts = "--ignore=tests/fixtures --tb=short -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W605"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
