server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The web client calls relative /api/v1 URLs; proxy them to the API
    # service on the Compose network (same role as the Vite dev proxy).
    location /api/ {
        proxy_pass http://axon-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
