[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axon-core"
version = "0.2.0"
description = "Axon static API graph models, parsers, indexing and local maintenance"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "ruamel-yaml==0.18.16",
]

[tool.hatch.build]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel]
only-include = [
    "axon/__init__.py", "axon/config.py", "axon/db",
    "axon/v1",
]
exclude = ["axon/v1/api.py", "axon/v1/jobs.py"]

[tool.hatch.build.targets.sdist]
only-include = ["axon/__init__.py", "axon/config.py", "axon/db", "axon/v1", "pyproject.toml"]
exclude = ["axon/v1/api.py", "axon/v1/jobs.py"]
